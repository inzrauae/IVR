# Local backing services. The Laravel app runs on the host (php artisan serve / composer dev).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cloudpbx
      POSTGRES_USER: cloudpbx
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
