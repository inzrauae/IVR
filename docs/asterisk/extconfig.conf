; Call queues are read live from Laravel's PostgreSQL database through two views created by the
; migrations (asterisk_queues, asterisk_queue_members). Membership and pause changes made in the
; portal apply on the next call without any push.
;
; Requires res_config_pgsql (see res_pgsql.conf). Give Asterisk a read-only database role:
;   CREATE ROLE asterisk_ro LOGIN PASSWORD '...';
;   GRANT SELECT ON asterisk_queues, asterisk_queue_members TO asterisk_ro;

[settings]
queues => pgsql,cloudpbx,asterisk_queues
queue_members => pgsql,cloudpbx,asterisk_queue_members
