; Transports only. Tenant endpoints are pushed by Laravel (see sorcery.conf).
; Replace 203.0.113.10 with the server's public address and the certificate paths with yours.

[global]
type=global
user_agent=CloudPBX

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=203.0.113.10
external_signaling_address=203.0.113.10
local_net=10.0.0.0/8

; Carriers that require SIP over TCP (trunk transport "tcp").
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_media_address=203.0.113.10
external_signaling_address=203.0.113.10
local_net=10.0.0.0/8

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/fullchain.pem
priv_key_file=/etc/asterisk/keys/privkey.pem
method=tlsv1_2
external_media_address=203.0.113.10
external_signaling_address=203.0.113.10
local_net=10.0.0.0/8

; Browsers (web phone) connect over WSS, served by http.conf's TLS listener.
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0
