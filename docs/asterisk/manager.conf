; AMI for the event listener (php artisan pbx:listen <server id>). Private interface only.

[general]
enabled=yes
bindaddr=10.0.0.5
port=5038

[laravel]
secret=change-me-to-a-long-random-secret
deny=0.0.0.0/0.0.0.0
permit=10.0.0.0/255.0.0.0
; call: channel/bridge/hangup events; system: ContactStatus (registrations);
; user: CloudPBXRecording / CloudPBXVoicemail announcements from the dialplan
read=call,system,user
write=call,system
