; CloudPBX shared dialplan (Asterisk 20+).
;
; One dialplan serves every tenant. Laravel never writes dialplan: it pushes each
; organization's configuration as global variables (app/Pbx/Routing/RoutingCompiler.php
; documents every key), and the contexts below interpret them.
;
; Tenant isolation: extension endpoints (o<org>_<number>) and trunk endpoints (o<org>_t<id>)
; carry CLOUDPBX_ORG via set_var, and every lookup below is keyed by it, so a caller can only
; reach numbers, menus and trunks of its own organization.
;
; Per-extension globals:   CPBX_<sip id>_{TIMEOUT,DND,VM,FWD,FWDBUSY,FWDNA}
; Per-organization globals: CPBX_O<org>_*      DIDs: CPBX_DID_<digits>
; Destinations ("DEST") are num:<internal number>, vm:<sip id>, out:<number> or hangup:.
; Globals live in memory; Laravel re-pushes them when it sees Asterisk restart (pbx:health).

[cloudpbx-internal]
; Calls from tenant phones.
exten => _X.,1,Goto(cloudpbx-route,${EXTEN},1)
exten => _+X.,1,Goto(cloudpbx-route,${EXTEN},1)
exten => _*X.,1,Goto(cloudpbx-route,${EXTEN},1)

[cloudpbx-inbound]
; Calls from carriers (trunk endpoints). The dialled DID must belong to the trunk's organization.
exten => _[+0-9].,1,Set(DIDNUM=${FILTER(0-9,${EXTEN})})
 same => n,Set(DID=${CPBX_DID_${DIDNUM}})
 same => n,GotoIf($["${DID}" = "" | "${CUT(DID,|,1)}" != "${CLOUDPBX_ORG}"]?unknown)
 same => n,Gosub(cloudpbx-record,s,1(inbound))
 same => n,Gosub(cloudpbx-isopen,s,1)
 same => n,Set(DEST=${IF($["${GOSUB_RETVAL}" = "1"]?${CUT(DID,|,2)}:${CUT(DID,|,3)})})
 same => n,Goto(cloudpbx-dest,s,1)
 same => n(unknown),Answer()
 same => n,Playback(ss-noservice)
 same => n,Hangup(1)

[cloudpbx-route]
; Every number dialled inside an organization: extensions, then groups/queues/rooms/menus,
; then the outside world.
exten => _[+*0-9].,1,GotoIf($["${CLOUDPBX_ORG}" = ""]?cloudpbx-reject,s,1)
 same => n,Set(__CPBX_HOPS=$[${IF($["${CPBX_HOPS}" = ""]?0:${CPBX_HOPS})} + 1])
 ; Forwarding / fallback chains (A -> B -> A ...) stop here.
 same => n,GotoIf($[${CPBX_HOPS} > 8]?cloudpbx-reject,s,1)
 same => n,Gosub(cloudpbx-record,s,1(internal))
 same => n,Set(TARGET=o${CLOUDPBX_ORG}_${EXTEN})
 same => n,GotoIf($["${CPBX_${TARGET}_TIMEOUT}" != ""]?cloudpbx-extension,${TARGET},1)
 same => n,Set(KIND=${CPBX_O${CLOUDPBX_ORG}_N_${EXTEN}})
 same => n,GotoIf($["${KIND}" != ""]?cloudpbx-${KIND},${EXTEN},1)
 same => n,Goto(cloudpbx-outbound,${EXTEN},1)

[cloudpbx-dest]
; Follows ${DEST}. Used by DIDs, IVR keys and every fallback.
exten => s,1,Set(DTYPE=${CUT(DEST,:,1)})
 same => n,Set(DVAL=${CUT(DEST,:,2)})
 same => n,GotoIf($["${DTYPE}" = "num" & "${DVAL}" != ""]?cloudpbx-route,${DVAL},1)
 same => n,GotoIf($["${DTYPE}" = "vm" & "${DVAL}" != ""]?cloudpbx-voicemail,${DVAL},1)
 same => n,GotoIf($["${DTYPE}" = "out" & "${DVAL}" != ""]?cloudpbx-route,${DVAL},1)
 same => n,Hangup(16)

[cloudpbx-extension]
; ${EXTEN} is the called extension's SIP id, e.g. o12_101.
exten => _o.,1,Set(T=${EXTEN})
 same => n,GotoIf($["${CPBX_${T}_DND}" = "1"]?unavailable)
 same => n,GotoIf($["${CPBX_${T}_FWD}" != ""]?cloudpbx-route,${CPBX_${T}_FWD},1)
 ; Ring every registered device of the extension at once.
 same => n,Set(CONTACTS=${PJSIP_DIAL_CONTACTS(${T})})
 same => n,GotoIf($["${CONTACTS}" = ""]?noanswer)
 same => n,Dial(${CONTACTS},${CPBX_${T}_TIMEOUT})
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n(noanswer),GotoIf($["${CPBX_${T}_FWDNA}" != ""]?cloudpbx-route,${CPBX_${T}_FWDNA},1)
 same => n,Goto(unavailable)
 same => n(busy),GotoIf($["${CPBX_${T}_FWDBUSY}" != ""]?cloudpbx-route,${CPBX_${T}_FWDBUSY},1)
 same => n(unavailable),GotoIf($["${CPBX_${T}_VM}" = "1"]?cloudpbx-voicemail,${T},1)
 same => n,Busy(10)
 same => n,Hangup()

[cloudpbx-voicemail]
; Records a message for mailbox ${EXTEN} (a SIP id) into the ARI stored-recordings directory,
; then announces it to Laravel with a CloudPBXVoicemail UserEvent.
exten => _o.,1,Set(MB=${EXTEN})
 same => n,Set(VMORG=${CUT(MB,_,1)})
 same => n,Set(UID=${UNIQUEID})
 same => n,Set(VMNAME=cpbx-vm-${MB}-${STRREPLACE(UID,.,-)})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(vm-intro)
 same => n,Set(VMSTART=${EPOCH})
 same => n,Set(CHANNEL(hangup_handler_push)=cloudpbx-voicemail-saved,s,1(${VMORG:1},${MB},${VMNAME}))
 same => n,Record(${ASTSPOOLDIR}/recording/${VMNAME}.wav,5,300,k)
 same => n,Playback(vm-msgsaved)
 same => n,Hangup()

[cloudpbx-voicemail-saved]
; Hangup handler. Messages shorter than two seconds are discarded.
exten => s,1,Set(SECS=$[${EPOCH} - ${VMSTART}])
 same => n,GotoIf($[${SECS} < 2]?done)
 same => n,UserEvent(CloudPBXVoicemail,Org: ${ARG1},Mailbox: ${ARG2},Name: ${ARG3},CallerNum: ${CALLERID(num)},CallerName: ${CALLERID(name)},Duration: ${SECS})
 same => n(done),Return()

[cloudpbx-record]
; Gosub(cloudpbx-record,s,1(<inbound|outbound|internal|force>)): starts recording the call if the
; organization's recording mode asks for it. Runs at most once per call.
exten => s,1,GotoIf($["${CPBX_RECORDING}" = "1"]?done)
 same => n,Set(MODE=${CPBX_O${CLOUDPBX_ORG}_REC})
 same => n,GotoIf($["${ARG1}" = "force" | "${MODE}" = "all" | "${MODE}" = "${ARG1}"]?start:done)
 same => n(start),Set(__CPBX_RECORDING=1)
 same => n,Set(LID=${CHANNEL(linkedid)})
 same => n,Set(RECNAME=cpbx-o${CLOUDPBX_ORG}-${STRREPLACE(LID,.,-)})
 same => n,MixMonitor(${ASTSPOOLDIR}/recording/${RECNAME}.wav,b)
 same => n,Set(CHANNEL(hangup_handler_push)=cloudpbx-record-saved,s,1(${CLOUDPBX_ORG},${RECNAME},${LID}))
 same => n(done),Return()

[cloudpbx-record-saved]
exten => s,1,UserEvent(CloudPBXRecording,Org: ${ARG1},Name: ${ARG2},Linkedid: ${ARG3})
 same => n,Return()

[cloudpbx-isopen]
; Gosub: returns 1 during open hours, 0 outside them or on a holiday.
exten => s,1,Set(P=CPBX_O${CLOUDPBX_ORG})
 same => n,Set(OPEN=0)
 same => n,Set(I=0)
 same => n,While($[${I} < ${IF($["${${P}_HOURS}" = ""]?0:${${P}_HOURS})}])
 same => n,Set(I=$[${I} + 1])
 same => n,ExecIf($["${IFTIME(${${P}_HOURS_${I}}?1:0)}" = "1"]?Set(OPEN=1))
 same => n,EndWhile()
 same => n,Set(I=0)
 same => n,While($[${I} < ${IF($["${${P}_CLOSED}" = ""]?0:${${P}_CLOSED})}])
 same => n,Set(I=$[${I} + 1])
 same => n,ExecIf($["${IFTIME(${${P}_CLOSED_${I}}?1:0)}" = "1"]?Set(OPEN=0))
 same => n,EndWhile()
 same => n,Return(${OPEN})

[cloudpbx-ringgroup]
; RG = strategy|seconds|sipid&sipid...|fallback DEST
exten => _X.,1,Set(RG=${CPBX_O${CLOUDPBX_ORG}_RG_${EXTEN}})
 same => n,Set(TMO=${CUT(RG,|,2)})
 same => n,Set(MEMBERS=${CUT(RG,|,3)})
 same => n,Set(DEST=${CUT(RG,|,4)})
 same => n,GotoIf($["${MEMBERS}" = ""]?cloudpbx-dest,s,1)
 same => n,Set(COUNT=${FIELDQTY(MEMBERS,&)})
 same => n,GotoIf($["${CUT(RG,|,1)}" = "sequential"]?sequential)
 ; Ring all: every registered device of every member not on do-not-disturb.
 same => n,Set(DIALS=)
 same => n,Set(I=0)
 same => n,While($[${I} < ${COUNT}])
 same => n,Set(I=$[${I} + 1])
 same => n,Set(M=${CUT(MEMBERS,&,${I})})
 same => n,Set(C=${PJSIP_DIAL_CONTACTS(${M})})
 same => n,ExecIf($["${C}" != "" & "${CPBX_${M}_DND}" != "1"]?Set(DIALS=${DIALS}&${C}))
 same => n,EndWhile()
 same => n,ExecIf($["${DIALS}" != ""]?Dial(${DIALS:1},${TMO}))
 same => n,Goto(cloudpbx-dest,s,1)
 ; One member after another, ${TMO} seconds each.
 same => n(sequential),Set(I=0)
 same => n,While($[${I} < ${COUNT}])
 same => n,Set(I=$[${I} + 1])
 same => n,Set(M=${CUT(MEMBERS,&,${I})})
 same => n,Set(C=${PJSIP_DIAL_CONTACTS(${M})})
 same => n,ExecIf($["${C}" != "" & "${CPBX_${M}_DND}" != "1"]?Dial(${C},${TMO}))
 same => n,EndWhile()
 same => n,Goto(cloudpbx-dest,s,1)

[cloudpbx-queue]
; Q = queue name|max wait|fallback DEST. Queues and members come from realtime (extconfig.conf).
exten => _X.,1,Set(Q=${CPBX_O${CLOUDPBX_ORG}_Q_${EXTEN}})
 same => n,Answer()
 same => n,Queue(${CUT(Q,|,1)},t,,,${CUT(Q,|,2)})
 same => n,Set(DEST=${CUT(Q,|,3)})
 same => n,Goto(cloudpbx-dest,s,1)

[cloudpbx-conference]
; CF = pin|max members|record (1/0)
exten => _X.,1,Set(CF=${CPBX_O${CLOUDPBX_ORG}_CF_${EXTEN}})
 same => n,Answer()
 same => n,ExecIf($["${CUT(CF,|,1)}" != ""]?Authenticate(${CUT(CF,|,1)}))
 same => n,GotoIf($["${CUT(CF,|,3)}" != "1"]?join)
 same => n,Gosub(cloudpbx-record,s,1(force))
 same => n(join),Set(CONFBRIDGE(bridge,max_members)=${CUT(CF,|,2)})
 same => n,ConfBridge(o${CLOUDPBX_ORG}_c${EXTEN})
 same => n,Hangup()

[cloudpbx-ivr]
; IVR = greeting URL|seconds to wait|retries|no-input DEST|invalid DEST; keys in IVR_<n>_<key>.
exten => _X.,1,Set(P=CPBX_O${CLOUDPBX_ORG}_IVR_${EXTEN})
 same => n,Set(CFG=${${P}})
 same => n,Set(PLAY=silence/1)
 ; Greetings are fetched over HTTPS from Laravel and cached (res_http_media_cache).
 same => n,ExecIf($["${CUT(CFG,|,1)}" != ""]?Set(PLAY=${CUT(CFG,|,1)}))
 same => n,Set(TRIES=$[${CUT(CFG,|,3)} + 1])
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Set(N=0)
 same => n(loop),Set(N=$[${N} + 1])
 same => n,Read(KEY,${PLAY},1,,1,${CUT(CFG,|,2)})
 same => n,GotoIf($["${KEY}" = ""]?noinput)
 same => n,Set(KEYNAME=${IF($["${KEY}" = "*"]?STAR:${KEY})})
 same => n,Set(DEST=${${P}_${KEYNAME}})
 same => n,GotoIf($["${DEST}" != ""]?cloudpbx-dest,s,1)
 same => n,Playback(option-is-invalid)
 same => n,GotoIf($[${N} < ${TRIES}]?loop)
 same => n,Set(DEST=${CUT(CFG,|,5)})
 same => n,Goto(cloudpbx-dest,s,1)
 same => n(noinput),GotoIf($[${N} < ${TRIES}]?loop)
 same => n,Set(DEST=${CUT(CFG,|,4)})
 same => n,Goto(cloudpbx-dest,s,1)

[cloudpbx-outbound]
; Outside numbers. Routes OUT_<n> = regex|trunk endpoint|strip|prepend|caller id, in priority
; order. Busy or unanswered is final; only an unavailable/congested trunk tries the next route.
exten => _[+*0-9].,1,Set(P=CPBX_O${CLOUDPBX_ORG})
 same => n,Gosub(cloudpbx-record,s,1(outbound))
 same => n,Set(CALLERID(num)=${IF($["${CLOUDPBX_OUTBOUND_CID}" != ""]?${CLOUDPBX_OUTBOUND_CID}:${${P}_CID})})
 same => n,ExecIf($["${${P}_MAXSEC}" != ""]?Set(TIMEOUT(absolute)=${${P}_MAXSEC}))
 same => n,Set(I=0)
 same => n,While($[${I} < ${IF($["${${P}_OUT}" = ""]?0:${${P}_OUT})}])
 same => n,Set(I=$[${I} + 1])
 same => n,Set(R=${${P}_OUT_${I}})
 same => n,ContinueWhile($[${REGEX("${CUT(R,|,1)}" ${EXTEN})} = 0])
 same => n,Set(STRIP=${CUT(R,|,3)})
 same => n,Set(NUM=${CUT(R,|,4)}${EXTEN:${STRIP}})
 same => n,ExecIf($["${CLOUDPBX_OUTBOUND_CID}" = "" & "${CUT(R,|,5)}" != ""]?Set(CALLERID(num)=${CUT(R,|,5)}))
 same => n,Dial(PJSIP/${NUM}@${CUT(R,|,2)},60)
 same => n,GotoIf($["${DIALSTATUS}" != "CHANUNAVAIL" & "${DIALSTATUS}" != "CONGESTION"]?done)
 same => n,EndWhile()
 same => n,Answer()
 same => n,Playback(ss-noservice)
 same => n(done),Hangup()

[cloudpbx-spy]
; Entered by an ARI originate to the supervisor's own extension (LiveCallController::spy).
; ${SPY_TARGET} is the agent's channel prefix, e.g. PJSIP/o12_101.
exten => listen,1,ChanSpy(${SPY_TARGET},qE)
exten => whisper,1,ChanSpy(${SPY_TARGET},qEw)
exten => barge,1,ChanSpy(${SPY_TARGET},qEB)

[cloudpbx-reject]
exten => s,1,Hangup(21)
