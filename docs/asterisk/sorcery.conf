; Lets Laravel create PJSIP objects at runtime through ARI ("push configuration").
; Static objects (transports) still come from pjsip.conf; tenant endpoints, AORs, auths,
; carrier IP matches and carrier registrations are written by ARI to AstDB, so they survive an
; Asterisk restart.

[res_pjsip]
endpoint=config,pjsip.conf,criteria=type=endpoint
endpoint=astdb,pjsip
aor=config,pjsip.conf,criteria=type=aor
aor=astdb,pjsip
auth=config,pjsip.conf,criteria=type=auth
auth=astdb,pjsip

; SIP trunks: "identify" matches a carrier's calls by source address.
[res_pjsip_endpoint_identifier_ip]
identify=config,pjsip.conf,criteria=type=identify
identify=astdb,pjsip

; SIP trunks that register with the carrier.
[res_pjsip_outbound_registration]
registration=config,pjsip.conf,criteria=type=registration
registration=astdb,pjsip
