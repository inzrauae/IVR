; Plain HTTP (ARI) listens on the private interface only. Never expose it publicly.
; TLS (WSS for the web phone) listens publicly on 8089; set the PBX server's "WSS URL" in the
; platform portal to wss://<sip domain>:8089/ws.

[general]
enabled=yes
bindaddr=10.0.0.5
bindport=8088
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/fullchain.pem
tlsprivatekey=/etc/asterisk/keys/privkey.pem
